# ─────────────────────────────────────────────────────────────
# PostgreSQL 16 — tuned for high-concurrency restaurant app
# Target: 100,000 concurrent users through PgBouncer
# ─────────────────────────────────────────────────────────────

# ── Connections ──────────────────────────────────────────────
# PgBouncer default_pool_size=100, so actual PG connections are
# limited. Set max_connections higher than pool to allow admin tools.
max_connections = 300

# ── Memory ───────────────────────────────────────────────────
# shared_buffers: ~25% of available RAM (adjust for your server)
shared_buffers = 1GB

# effective_cache_size: ~75% of RAM — tells planner how much
# data the OS will cache. Does NOT allocate memory.
effective_cache_size = 3GB

# work_mem: per-operation sort/hash memory. Keep low because
# many concurrent operations multiply this.
work_mem = 16MB

# maintenance_work_mem: for VACUUM, CREATE INDEX, etc.
maintenance_work_mem = 256MB

# ── WAL (Write-Ahead Log) ───────────────────────────────────
# Larger wal_buffers reduce disk flushes during writes.
wal_buffers = 64MB

# Spread checkpoints over 90% of checkpoint_timeout.
checkpoint_completion_target = 0.9

# ── Planner ──────────────────────────────────────────────────
# SSD-optimized: random reads are nearly as fast as sequential.
random_page_cost = 1.1

# Number of concurrent I/O operations for bitmap heap scans.
effective_io_concurrency = 200

# ── Logging ──────────────────────────────────────────────────
# Log queries slower than 500ms for performance analysis.
log_min_duration_statement = 500

# ── Autovacuum ───────────────────────────────────────────────
# More aggressive autovacuum for high-write tables (orders, order_items).
autovacuum_max_workers = 4
autovacuum_naptime = 30s
autovacuum_vacuum_scale_factor = 0.05
autovacuum_analyze_scale_factor = 0.025

# ── Connection handling ──────────────────────────────────────
# Close idle connections faster (PgBouncer manages reconnection).
idle_in_transaction_session_timeout = 60s
