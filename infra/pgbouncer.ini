[databases]
; Connect to PostgreSQL via hostname "postgres" (Docker service name)
Project_M = host=postgres port=5432 dbname=Project_M auth_user=postgres

[pgbouncer]
; ── Pool mode ────────────────────────────────────────────────
; transaction: connections are returned to pool after each transaction
; This is the most efficient mode for web apps — one PG connection
; can serve hundreds of app connections.
pool_mode = transaction

; The Go client uses the simple protocol. Keep transaction-pool prepared
; statement tracking disabled unless both sides are changed and tested together.
max_prepared_statements = 0

; ── Connection limits ────────────────────────────────────────
; max_client_conn: total client connections PgBouncer will accept
; For 100k users: each Go instance has ~100 conns to PgBouncer,
; plus room for admin/monitoring tools.
max_client_conn = 10000

; default_pool_size: actual PG connections per database
; PostgreSQL max_connections = 300, leave headroom for direct admin.
default_pool_size = 100

; Minimum connections to keep open even when idle.
min_pool_size = 25

; Extra connections for burst traffic when default_pool_size is exhausted.
reserve_pool_size = 25
reserve_pool_timeout = 3

; ── Timeouts ─────────────────────────────────────────────────
; Kill idle client connections after 5 minutes.
client_idle_timeout = 300

; Kill idle server connections after 1 minute.
server_idle_timeout = 60

; Abort queries that run longer than 2 minutes.
query_timeout = 120

; Wait up to 10 seconds for a connection from pool.
query_wait_timeout = 10

; ── Auth ─────────────────────────────────────────────────────
auth_type = md5
auth_file = /etc/pgbouncer/userlist.txt

; ── Logging ──────────────────────────────────────────────────
admin_users = postgres
stats_users = postgres
log_connections = 0
log_disconnections = 0
log_pooler_errors = 1

; ── Network ──────────────────────────────────────────────────
listen_addr = 0.0.0.0
listen_port = 6432
