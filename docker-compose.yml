# Restaurant Hub production stack
# Architecture: Nginx -> one Go backend -> PgBouncer -> PostgreSQL.
# Keep one backend replica until realtime events use shared cross-instance fan-out.
#
# Required local-only configuration:
#   - Set DB_PASSWORD and JWT_SECRET in the shell or ignored root .env.
#   - Create ignored infra/userlist.txt from infra/userlist.example.txt.
# Never commit real credentials to this file or the PgBouncer userlist.

x-backend-environment: &backend-environment
  GIN_MODE: release
  DB_HOST: pgbouncer
  DB_PORT: "6432"
  DB_USER: ${DB_USER:-postgres}
  DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in the environment or root .env}
  DB_NAME: ${DB_NAME:-Project_M}
  DB_SSLMODE: ${DB_SSLMODE:-disable}
  DB_MAX_OPEN_CONNS: "100"
  DB_MAX_IDLE_CONNS: "25"
  DB_CONN_MAX_LIFETIME_MIN: "30"
  DB_CONN_MAX_IDLE_TIME_MIN: "5"
  JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in the environment or root .env}
  SERVER_HOST: "0.0.0.0"
  SERVER_PORT: "8080"
  FRONTEND_URL: ${FRONTEND_URL:-https://dishy.pro}
  PUBLIC_BACKEND_URL: ${PUBLIC_BACKEND_URL:-https://api.dishy.pro}
  CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-https://dishy.pro}
  SMTP_HOST: ${SMTP_HOST:-}
  SMTP_PORT: ${SMTP_PORT:-587}
  SMTP_FROM: ${SMTP_FROM:-}
  SMTP_USER: ${SMTP_USER:-}
  SMTP_PASSWORD: ${SMTP_PASSWORD:-}
  AI_PROVIDER: ${AI_PROVIDER:-auto}
  AI_CONVERSATION_MEMORY_ENABLED: ${AI_CONVERSATION_MEMORY_ENABLED:-false}
  AI_ORCHESTRATOR_MODE: ${AI_ORCHESTRATOR_MODE:-legacy}
  AI_ACTIONS_ENABLED: ${AI_ACTIONS_ENABLED:-false}
  AI_ACTIONS_ALLOWED_RESTAURANT_IDS: ${AI_ACTIONS_ALLOWED_RESTAURANT_IDS:-}
  AI_OBSERVABILITY_ENABLED: ${AI_OBSERVABILITY_ENABLED:-false}
  AI_DAILY_REQUEST_BUDGET: ${AI_DAILY_REQUEST_BUDGET:-0}
  AI_DAILY_TOKEN_BUDGET: ${AI_DAILY_TOKEN_BUDGET:-0}
  AI_LATENCY_WARN_MS: ${AI_LATENCY_WARN_MS:-5000}
  GROQ_API_KEYS: ${GROQ_API_KEYS:-}
  GROQ_MODEL: ${GROQ_MODEL:-openai/gpt-oss-20b}
  GROQ_PLANNER_MODEL: ${GROQ_PLANNER_MODEL:-openai/gpt-oss-20b}
  GEMINI_API_KEYS: ${GEMINI_API_KEYS:-}
  GEMINI_MODEL: ${GEMINI_MODEL:-gemini-3.5-flash-lite}
  GEMINI_PLANNER_MODEL: ${GEMINI_PLANNER_MODEL:-gemini-3.5-flash-lite}

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in the environment or root .env}
      POSTGRES_DB: ${DB_NAME:-Project_M}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./infra/postgresql.conf:/etc/postgresql/postgresql.conf:ro
    command: postgres -c config_file=/etc/postgresql/postgresql.conf
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres} -d ${DB_NAME:-Project_M}"]
      interval: 5s
      timeout: 3s
      retries: 5

  pgbouncer:
    image: edoburu/pgbouncer:1.23.1
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./infra/pgbouncer.ini:/etc/pgbouncer/pgbouncer.ini:ro
      - ./infra/userlist.txt:/etc/pgbouncer/userlist.txt:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -p 6432"]
      interval: 5s
      timeout: 3s
      retries: 5

  migrate:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: "no"
    depends_on:
      pgbouncer:
        condition: service_healthy
    environment: *backend-environment
    command: ["./migrate"]

  backend-1:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      migrate:
        condition: service_completed_successfully
    environment: *backend-environment
    volumes:
      - uploads:/app/uploads

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    depends_on:
      backend-1:
        condition: service_healthy
    ports:
      - "80:80"
    volumes:
      - ./infra/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - uploads:/app/uploads:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/nginx-health || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 3

volumes:
  pgdata:
    driver: local
  uploads:
    driver: local
